<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gless Street Radio | High-Fidelity Analog Sound</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #090a0f;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        /* AUTHENTIC JUKEBOX CABINET STRUCTURE */
        .jukebox-cabinet {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(135deg, #3d2314 0%, #1c0f07 100%);
            border: 8px solid #5c321b;
            border-top-left-radius: 120px;
            border-top-right-radius: 120px;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            padding: 40px 25px 30px 25px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.6);
            margin-top: 20px;
            position: relative;
        }
        /* Chrome Trim Pillars on Sides */
        .jukebox-cabinet::before, .jukebox-cabinet::after {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            width: 10px;
            background: linear-gradient(90deg, #888, #fff, #555);
            border-radius: 5px;
        }
        .jukebox-cabinet::before { left: 4px; }
        .jukebox-cabinet::after { right: 4px; }

        header {
            text-align: center;
            margin-bottom: 25px;
        }
        header h1 {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #f39c12;
            margin-bottom: 4px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        header p {
            font-size: 0.75rem;
            color: #d1d5db;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* The Illuminated Bubble / Dial Window */
        .dial-window {
            background: #111318;
            border: 4px solid #362215;
            border-radius: 12px;
            padding: 25px 20px;
            text-align: center;
            box-shadow: inset 0 8px 25px rgba(0,0,0,0.9);
            margin-bottom: 25px;
        }
        .dial-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .dial-status {
            font-size: 0.8rem;
            color: #f39c12;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        audio {
            width: 100%;
            accent-color: #f39c12;
        }

        /* Speaker Grill Section at Bottom of Jukebox */
        .speaker-grill {
            background: #15100d;
            border: 3px solid #2d1a10;
            border-radius: 8px;
            height: 70px;
            background-image: repeating-linear-gradient(0deg, transparent, transparent 4px, #26170e 4px, #26170e 8px);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.8);
        }
        .speaker-badge {
            font-size: 0.65rem;
            color: #886045;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-weight: bold;
            background: #0d0a08;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #3d2314;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .nav-links a {
            color: #a0a8b4;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #f39c12;
        }
        footer {
            margin-top: 25px;
            font-size: 0.7rem;
            color: #777;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="jukebox-cabinet">
        <header>
            <h1>Gless Street Radio</h1>
            <p>High-Fidelity Analog Sound & Timeless Soul</p>
        </header>

        <div class="dial-window">
            <div class="dial-title">Analog Studio Master Feed</div>
            <div class="dial-status">Needle Dropping Soon</div>
            <audio controls>
                <source src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <div class="speaker-grill">
            <div class="speaker-badge">GSR High-Fidelity</div>
        </div>

        <div class="nav-links">
            <a href="#catalog">Catalog</a>
            <a href="#about">About</a>
            <a href="#terms">Terms</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Gless Street Radio. Produced by Rene Carmona.
    </footer>

</body>
</html>
