<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gless Street Radio | High-Fidelity Analog Sound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f0d0b;
            --cabinet-wood: #2a1b12;
            --cabinet-border: #4a3222;
            --glass-bg: #16120f;
            --accent-gold: #d4af37;
            --accent-gold-hover: #e6c555;
            --cream: #f4eee1;
            --text-muted: #a3988d;
            --amber-glow: rgba(212, 175, 55, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--cream);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        header {
            text-align: center;
            padding: 2rem 1rem 1rem 1rem;
            border-bottom: 1px solid #261e18;
            background: linear-gradient(to bottom, #1d140e, var(--bg-dark));
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.3rem;
            letter-spacing: 2px;
            color: var(--cream);
            margin-bottom: 0.3rem;
        }

        header p {
            color: var(--accent-gold);
            font-size: 0.85rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        /* Architectural Vintage Jukebox Cabinet Styling */
        .jukebox-cabinet {
            background: linear-gradient(135deg, #322116 0%, var(--cabinet-wood) 50%, #1c120c 100%);
            border: 4px solid var(--cabinet-border);
            border-radius: 20px 20px 12px 12px;
            width: 100%;
            max-width: 500px;
            padding: 1.8rem;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9), inset 0 0 30px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        /* Glowing Amber Side Architectural Pillars */
        .jukebox-cabinet::before, .jukebox-cabinet::after {
            content: '';
            position: absolute;
            top: 20px;
            bottom: 20px;
            width: 10px;
            background: linear-gradient(to bottom, #8c672b, var(--accent-gold), #8c672b);
            border-radius: 4px;
            box-shadow: 0 0 12px var(--accent-gold);
        }
        .jukebox-cabinet::before { left: 10px; }
        .jukebox-cabinet::after { right: 10px; }

        .cabinet-header {
            text-align: center;
            margin-bottom: 1.2rem;
        }

        .cabinet-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            color: var(--cream);
            letter-spacing: 1px;
            margin-bottom: 0.1rem;
        }

        .cabinet-header span {
            font-size: 0.7rem;
            color: var(--accent-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Glass Viewing Window Container */
        .turntable-deck {
            width: 100%;
            height: 250px;
            background: radial-gradient(circle, #221914 0%, var(--glass-bg) 85%);
            border-radius: 12px;
            border: 3px inset #3a2b20;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.2rem;
            overflow: hidden;
            box-shadow: inset 0 10px 25px rgba(0,0,0,0.9), 0 0 15px var(--amber-glow);
        }

        .vinyl-record {
            width: 210px;
            height: 210px;
            background: radial-gradient(circle, 
                #111 0%, 
                #111 38%, 
                #222 39%, 
                #111 41%, 
                #111 68%, 
                #1a1a1a 69%, 
                #0a0a0a 75%
            );
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 8px 20px rgba(0,0,0,0.7);
            transform: translateY(-100px) scale(0.5);
            opacity: 0;
            transition: transform 1s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.6s ease;
        }

        .vinyl-record.playing {
            transform: translateY(0) scale(1);
            opacity: 1;
            animation: spin 3s linear infinite 0.8s;
        }

        @keyframes spin {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(0) scale(1) rotate(360deg); }
        }

        .record-label {
            width: 70px;
            height: 70px;
            background-color: var(--accent-gold);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .record-center-hole {
            width: 10px;
            height: 10px;
            background-color: var(--bg-dark);
            border-radius: 50%;
            border: 2px solid #fff;
        }

        /* Tonearm Desktop Default */
        .tonearm {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 30px;
            height: 140px;
            pointer-events: none;
            transform-origin: 15px 15px;
            transform: rotate(0deg);
            transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1) 0.8s;
            z-index: 10;
        }

        .tonearm.engaged {
            transform: rotate(38deg);
        }

        /* Tonearm Mobile Adjustment */
        @media (max-width: 600px) {
            .tonearm.engaged {
                transform: rotate(24deg);
            }
        }

        .tonearm-base {
            position: absolute;
            top: 0; left: 0;
            width: 30px; height: 30px;
            background: linear-gradient(135deg, #ccc, #666);
            border-radius: 50%;
            box-shadow: 0 3px 6px rgba(0,0,0,0.5);
        }

        .tonearm-rod {
            position: absolute;
            top: 15px; left: 13px;
            width: 4px; height: 110px;
            background: linear-gradient(90deg, #ddd, #888, #fff);
            border-radius: 2px;
        }

        .tonearm-head {
            position: absolute;
            bottom: 5px; left: 9px;
            width: 12px; height: 18px;
            background: #222;
            border-radius: 2px;
            border: 1px solid #444;
        }

        .track-info {
            text-align: center;
            margin-bottom: 1.2rem;
            min-height: 45px;
        }

        .track-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 0.15rem;
        }

        .track-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .btn-drop {
            background: linear-gradient(to bottom, #e6c555, var(--accent-gold));
            color: #12100e;
            border: 1px solid #b8972b;
            padding: 0.85rem;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-drop:hover {
            background: linear-gradient(to bottom, #f3d466, var(--accent-gold-hover));
        }

        .btn-drop:active {
            transform: scale(0.98);
        }

        audio {
            width: 100%;
            accent-color: var(--accent-gold);
        }

        footer {
            border-top: 1px solid #261e18;
            padding: 1.2rem 1rem;
            background-color: #17110c;
            text-align: center;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            list-style: none;
            margin-bottom: 0.8rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        .producer-credit {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gless Street Radio</h1>
        <p>High-Fidelity Analog Sound</p>
    </header>

    <main>
        <div class="jukebox-cabinet">
            <div class="cabinet-header">
                <h2>The Truth Box Jukebox</h2>
                <span>Analog Studio Master</span>
            </div>

            <div class="turntable-deck" id="deck">
                <div class="vinyl-record" id="vinyl">
                    <div class="record-label">
                        <div class="record-center-hole"></div>
                    </div>
                </div>
                <div class="tonearm" id="tonearm">
                    <div class="tonearm-base"></div>
                    <div class="tonearm-rod"></div>
                    <div class="tonearm-head"></div>
                </div>
            </div>

            <div class="track-info">
                <div class="track-title" id="trackTitle">Needle Dropping Soon</div>
                <div class="track-meta" id="trackMeta">Select play to drop the record</div>
            </div>

            <div class="player-controls">
                <button class="btn-drop" id="playBtn">Drop Needle & Play</button>
                <audio id="audioPlayer" controls preload="metadata">
                    <source src="" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </main>

    <footer>
        <ul class="nav-links">
            <li><a href="#catalog">Catalog</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#terms">Terms</a></li>
        </ul>
        <div class="producer-credit">Produced by Rene Carmona</div>
    </footer>

    <script>
        const playBtn = document.getElementById('playBtn');
        const vinyl = document.getElementById('vinyl');
        const tonearm = document.getElementById('tonearm');
        const audioPlayer = document.getElementById('audioPlayer');
        const trackTitle = document.getElementById('trackTitle');
        const trackMeta = document.getElementById('trackMeta');

        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                vinyl.classList.add('playing');
                tonearm.classList.add('engaged');
                playBtn.textContent = 'Lift Needle & Pause';
                trackTitle.textContent = 'Featured Session: Analog Master';
                trackMeta.textContent = 'Tube-Driven Warmth • Wide Stereo Field';
                isPlaying = true;
            } else {
                vinyl.classList.remove('playing');
                tonearm.classList.remove('engaged');
                playBtn.textContent = 'Drop Needle & Play';
                trackTitle.textContent = 'Needle Dropping Soon';
                trackMeta.textContent = 'Select play to drop the record';
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
