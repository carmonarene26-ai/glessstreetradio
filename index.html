<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gless Street Radio | High-Fidelity Analog Sound</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0c10;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 600px;
            text-align: center;
            /* Vintage Jukebox Cabinet Styling */
            background: linear-gradient(135deg, #2b170c 0%, #1a0f07 100%);
            border: 6px solid #4a2814;
            border-radius: 24px;
            padding: 40px 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 0 30px rgba(243, 156, 18, 0.1);
            margin-top: 20px;
        }
        header h1 {
            font-size: 2.4rem;
            font-weight: 800;
            letter-spacing: 2px;
            color: #f39c12;
            margin-bottom: 6px;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }
        header p {
            font-size: 0.9rem;
            color: #d1d5db;
            margin-bottom: 30px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }
        /* Jukebox Display Window */
        .jukebox-window {
            background: #111318;
            border: 4px solid #362215;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: inset 0 8px 20px rgba(0,0,0,0.9);
            position: relative;
        }
        /* Glowing Neon-Free Arch Accent */
        .jukebox-arch {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle, #b84a23 0%, #4a1c0d 70%);
            border: 4px solid #f39c12;
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(243, 156, 18, 0.3);
        }
        .arch-title {
            font-size: 0.65rem;
            font-weight: bold;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .track-info {
            margin-bottom: 20px;
        }
        .track-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
        }
        .track-status {
            font-size: 0.85rem;
            color: #f39c12;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }
        audio {
            width: 100%;
            margin-top: 10px;
            accent-color: #f39c12;
        }
        .nav-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .nav-links a {
            color: #b0b8c4;
            text-decoration: none;
            transition: color 0.2s;
        }
        .nav-links a:hover {
            color: #f39c12;
        }
        footer {
            margin-top: 30px;
            font-size: 0.75rem;
            color: #888;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Gless Street Radio</h1>
            <p>High-Fidelity Analog Sound & Timeless Soul</p>
        </header>

        <div class="jukebox-window">
            <div class="jukebox-arch">
                <span class="arch-title">GSR Cabinet</span>
            </div>

            <div class="track-info">
                <div class="track-title">Analog Studio Master Feed</div>
                <div class="track-status">Needle Dropping Soon</div>
            </div>
            
            <audio controls>
                <source src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <div class="nav-links">
            <a href="#catalog">Catalog</a>
            <a href="#about">About</a>
            <a href="#terms">Terms</a>
        </div>
    </div>

    <footer>
        &copy; 2026 Gless Street Radio. Produced by Rene Carmona.
    </footer>

</body>
</html>
