<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gless Street Radio | High-Fidelity Analog Sound</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #12100e;
            --panel-bg: #1a1613;
            --panel-border: #332922;
            --accent-gold: #d4af37;
            --accent-gold-hover: #e6c555;
            --cream: #f4eee1;
            --text-muted: #a3988d;
            --wood-dark: #241a14;
            --vinyl-black: #0d0d0d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--cream);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
        }

        /* Header */
        header {
            text-align: center;
            padding: 2.5rem 1rem 1rem 1rem;
            border-bottom: 1px solid var(--panel-border);
            background: linear-gradient(to bottom, #1d1814, var(--bg-dark));
        }

        header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            color: var(--cream);
            margin-bottom: 0.3rem;
        }

        header p {
            color: var(--accent-gold);
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 600;
        }

        /* Main Container */
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1rem;
        }

        /* The Truth Box / Turntable Jukebox Console */
        .truth-box {
            background-color: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            width: 100%;
            max-width: 520px;
            padding: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7), inset 0 2px 5px rgba(212, 175, 55, 0.1);
            position: relative;
        }

        .truth-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.2);
            pointer-events: none;
        }

        .console-header {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .console-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--cream);
            margin-bottom: 0.2rem;
        }

        .console-header span {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Turntable Wells */
        .turntable-deck {
            width: 100%;
            height: 280px;
            background-color: var(--wood-dark);
            border-radius: 8px;
            border: 1px solid #2d231c;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            overflow: hidden;
            box-shadow: inset 0 10px 20px rgba(0,0,0,0.8);
        }

        /* Vinyl Record */
        .vinyl-record {
            width: 240px;
            height: 240px;
            background: radial-gradient(circle, 
                var(--vinyl-black) 0%, 
                var(--vinyl-black) 35%, 
                #1a1a1a 36%, 
                #1a1a1a 38%, 
                var(--vinyl-black) 39%, 
                var(--vinyl-black) 65%, 
                #151515 66%, 
                var(--vinyl-black) 68%
            );
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transform: translateY(120px) scale(0.6);
            opacity: 0;
            transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.8s ease;
        }

        .vinyl-record.playing {
            transform: translateY(0) scale(1);
            opacity: 1;
            animation: spin 3s linear infinite 1.2s;
        }

        @keyframes spin {
            0% { transform: translateY(0) scale(1) rotate(0deg); }
            100% { transform: translateY(0) scale(1) rotate(360deg); }
        }

        /* Record Center Label */
        .record-label {
            width: 90px;
            height: 90px;
            background-color: var(--accent-gold);
            border-radius: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 4px solid #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .record-label::after {
            content: '';
            width: 12px;
            height: 12px;
            background-color: var(--bg-dark);
            border-radius: 50%;
            position: absolute;
            border: 2px solid #fff;
        }

        /* Tonearm */
        .tonearm {
            position: absolute;
            top: 20px;
            right: 25px;
            width: 120px;
            height: 150px;
            pointer-events: none;
            transform-origin: top right;
            transform: rotate(-25deg);
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1) 1s;
        }

        .tonearm.engaged {
            transform: rotate(5deg);
        }

        .tonearm-base {
            position: absolute;
            top: 0; right: 0;
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #bbb, #555);
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }

        .tonearm-rod {
            position: absolute;
            top: 14px; right: 14px;
            width: 4px; height: 120px;
            background: linear-gradient(90deg, #ccc, #777, #eee);
            transform-origin: top center;
            transform: rotate(-15deg);
            border-radius: 2px;
        }

        /* Track Info Display */
        .track-info {
            text-align: center;
            margin-bottom: 1.5rem;
            min-height: 55px;
        }

        .track-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--cream);
            margin-bottom: 0.2rem;
        }

        .track-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Controls Panel */
        .player-controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .btn-drop {
            background-color: var(--accent-gold);
            color: var(--bg-dark);
            border: none;
            padding: 0.9rem;
            border-radius: 6px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }

        .btn-drop:hover {
            background-color: var(--accent-gold-hover);
        }

        .btn-drop:active {
            transform: scale(0.98);
        }

        /* Audio Element Hidden / Integrated */
        audio {
            width: 100%;
            margin-top: 0.5px;
            accent-color: var(--accent-gold);
        }

        /* Footer Navigation */
        footer {
            border-top: 1px solid var(--panel-border);
            padding: 1.5rem 1rem;
            background-color: var(--panel-bg);
            text-align: center;
        }

        .nav-links {
            display: flex;
            justify-content: center;
            gap: 2rem;
            list-style: none;
            margin-bottom: 1rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .nav-links a:hover {
            color: var(--accent-gold);
        }

        .producer-credit {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Gless Street Radio</h1>
        <p>High-Fidelity Analog Sound</p>
    </header>

    <main>
        <div class="truth-box">
            <div class="console-header">
                <h2>The Truth Box Jukebox</h2>
                <span>Analog Studio Master</span>
            </div>

            <!-- Turntable Well -->
            <div class="turntable-deck" id="deck">
                <div class="vinyl-record" id="vinyl">
                    <div class="record-label"></div>
                </div>
                <!-- Precision Tonearm -->
                <div class="tonearm" id="tonearm">
                    <div class="tonearm-base"></div>
                    <div class="tonearm-rod"></div>
                </div>
            </div>

            <!-- Track Display -->
            <div class="track-info">
                <div class="track-title" id="trackTitle">Needle Dropping Soon</div>
                <div class="track-meta" id="trackMeta">Select play to drop the record</div>
            </div>

            <!-- Player Controls -->
            <div class="player-controls">
                <button class="btn-drop" id="playBtn">Drop Needle & Play</button>
                <audio id="audioPlayer" controls preload="metadata">
                    <!-- Replace src with your hosted audio stream or file URL when ready -->
                    <source src="" type="audio/mpeg">
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </main>

    <footer>
        <ul class="nav-links">
            <li><a href="#catalog">Catalog</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#terms">Terms</a></li>
        </ul>
        <div class="producer-credit">Produced by Rene Carmona</div>
    </footer>

    <script>
        const playBtn = document.getElementById('playBtn');
        const vinyl = document.getElementById('vinyl');
        const tonearm = document.getElementById('tonearm');
        const audioPlayer = document.getElementById('audioPlayer');
        const trackTitle = document.getElementById('trackTitle');
        const trackMeta = document.getElementById('trackMeta');

        let isPlaying = false;

        playBtn.addEventListener('click', () => {
            if (!isPlaying) {
                // Trigger record drop and arm engagement animation
                vinyl.classList.add('playing');
                tonearm.classList.add('engaged');
                playBtn.textContent = 'Lift Needle & Pause';
                trackTitle.textContent = 'Featured Session: Analog Master';
                trackMeta.textContent = 'Tube-Driven Warmth • Wide Stereo Field';
                
                // If you have an audio source linked, play it:
                // audioPlayer.play();
                
                isPlaying = true;
            } else {
                vinyl.classList.remove('playing');
                tonearm.classList.remove('engaged');
                playBtn.textContent = 'Drop Needle & Play';
                trackTitle.textContent = 'Needle Dropping Soon';
                trackMeta.textContent = 'Select play to drop the record';
                
                // audioPlayer.pause();
                
                isPlaying = false;
            }
        });
    </script>
</body>
</html>
